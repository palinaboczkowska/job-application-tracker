name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build
        # SQLite (file-based and in-memory) only -- no external service, so
        # this single job already exercises the real stack end to end.
        # Unlike this portfolio's other projects, there's nothing further
        # to check live: no vendor API, no network dependency, no key.
